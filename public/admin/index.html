<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de reservas – Staff</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/floorplan.css">
</head>
<body>
<div class="admin">
  <header class="admin-topbar">
    <div>
      <div class="admin-title" id="restaurantName">Panel de reservas</div>
      <div class="admin-sub">Gestión del local</div>
    </div>
    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">
      <div id="sessionBar"></div>
      <a class="btn btn-secondary" href="/admin/config.html">Configuración de sala</a>
      <button class="btn btn-primary" id="openNewBtn">+ Nueva reserva (teléfono)</button>
    </div>
  </header>

  <div class="admin-controls">
    <label class="field">
      <span>Día</span>
      <input type="date" id="dateFilter">
    </label>
    <div class="day-nav">
      <button class="btn-icon" id="prevDayBtn">&larr;</button>
      <button class="btn-icon" id="todayBtn">Hoy</button>
      <button class="btn-icon" id="nextDayBtn">&rarr;</button>
    </div>
    <div class="stats" id="dayStats"></div>
    <button class="btn btn-secondary" id="monthViewBtn" style="margin-left:auto">📅 Vista mensual</button>
  </div>

  <div class="shift-col hidden" id="monthView" style="margin-bottom:20px">
    <div class="month-nav">
      <button class="btn-icon" id="prevMonthBtn">&larr;</button>
      <h3 id="monthLabel" style="margin:0"></h3>
      <button class="btn-icon" id="nextMonthBtn">&rarr;</button>
      <button class="btn btn-secondary" id="closeMonthBtn" style="margin-left:auto">Cerrar</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="shift-col" style="margin-bottom:20px" id="dayView">
    <h3>Plano — ocupación del día</h3>
    <div class="fp-shift-toggle" id="fpShiftToggle">
      <button data-shift="Comida" class="active">Comida</button>
      <button data-shift="Cena">Cena</button>
    </div>
    <div id="closureBar" style="margin-bottom:10px"></div>
    <div class="fp-stats" id="fpStats"></div>
    <div class="fp-zone-stats" id="fpZoneStats"></div>
    <div id="floorPlanView"></div>
    <div class="fp-legend">
      <span><span class="fp-legend-dot"></span>Libre</span>
      <span><span class="fp-legend-dot busy"></span>Ocupada (tiene reserva en este turno)</span>
    </div>
  </div>

  <div class="shift-columns" id="shiftColumns"></div>
</div>

<!-- Modal: new / edit reservation -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Nueva reserva</h2>
    <div class="field-row">
      <label class="field"><span>Nombre</span><input type="text" id="mName"></label>
      <label class="field"><span>Teléfono</span><input type="tel" id="mPhone"></label>
    </div>
    <div class="field-row">
      <label class="field"><span>Fecha</span><input type="date" id="mDate"></label>
      <label class="field"><span>Hora</span><select id="mTime"></select></label>
      <label class="field"><span>Comensales</span><input type="number" id="mParty" min="1" value="2"></label>
    </div>
    <label class="field"><span>Notas</span><textarea id="mNotes" rows="2"></textarea></label>
    <p class="error" id="modalError"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="modalSaveBtn">Guardar reserva</button>
    </div>
  </div>
</div>

<script src="/admin/authbar.js"></script>
<script src="/admin/floorplan.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
